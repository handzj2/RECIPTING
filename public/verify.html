<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Verification | HandzJ Digital Receipts</title>
<meta name="description" content="Verify a HandzJ digital receipt and confirm its receipt status and details.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5; --panel:#ffffff; --ink:#0f1724; --ink-soft:#4a5568;
  --line:#d0d7e2; --brand:#0a1628; --ok:#0f7b52; --ok-soft:#e2f4ec;
  --bad:#a32020; --bad-soft:#fbe7e7; --unk:#6b7789; --unk-soft:#eef1f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c111a; --panel:#141b26; --ink:#e8edf5; --ink-soft:#9dabc0;
    --line:#26303f; --ok:#5fd6a4; --ok-soft:#10301f;
    --bad:#ff8a8a; --bad-soft:#341414; --unk:#8c97a8; --unk-soft:#1c2533;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:32px 16px 64px}

.vdoc{background:var(--panel);border:1px solid var(--line);border-radius:0}
.vdoc-head{padding:18px 22px 14px;border-bottom:3px solid var(--brand);text-align:center}
.vdoc-head .title{font-family:"Barlow Condensed",Inter,sans-serif;font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.vdoc-head .rno{font-family:"Barlow Condensed",Inter,sans-serif;font-size:24px;font-weight:700;letter-spacing:.06em;color:var(--brand)}

.vdoc-status{padding:22px 22px 18px;text-align:center}
.status-mark{width:52px;height:52px;margin:0 auto 12px;border:3px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1}
.status-mark.ok{border-color:var(--ok);color:var(--ok)}
.status-mark.bad{border-color:var(--bad);color:var(--bad)}
.status-mark.unk{border-color:var(--unk);color:var(--unk)}
.status-label{font-family:"Barlow Condensed",Inter,sans-serif;font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.status-label.ok{color:var(--ok)}
.status-label.bad{color:var(--bad)}
.status-label.unk{color:var(--unk)}
.status-sub{font-size:13px;color:var(--ink-soft)}

.biz{padding:18px 22px;border-top:1px solid var(--line);background:var(--ok-soft);display:flex;gap:14px;align-items:flex-start}
.biz img{width:46px;height:46px;border-radius:4px;object-fit:cover;background:var(--panel);border:1px solid var(--line);flex:0 0 auto}
.biz .name{font-family:"Barlow Condensed",Inter,sans-serif;font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.biz .sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}

.narrative{padding:14px 22px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);line-height:1.6}

.section{border-top:1px solid var(--line);padding:14px 22px}
.section .sh{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px;border-bottom:1px solid #e8edf4}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-soft);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;flex:0 0 110px}
.row .v{text-align:right;font-weight:500}
.row .v b{font-weight:700}

.issued-to{font-family:"Barlow Condensed",Inter,sans-serif;font-size:18px;font-weight:700;color:var(--ink)}
.issued-to.none{font-family:Inter,sans-serif;font-size:13.5px;font-weight:500;color:var(--ink-soft);font-style:italic}

.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--line)}
.items-table th.num,.items-table td.num{text-align:right}
.items-table td{padding:7px 0;border-bottom:1px solid #e8edf4}
.items-table tr:last-child td{border-bottom:0}

.total-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-top:1px solid var(--line);background:var(--unk-soft)}
.total-bar .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.total-bar .v{font-family:"Barlow Condensed",Inter,sans-serif;font-size:24px;font-weight:700;color:var(--ink)}

.verif-note{padding:14px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);line-height:1.6}
.verif-note b{color:var(--ink)}

.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--ink-soft);line-height:1.65}
.foot a{color:inherit;text-decoration:underline}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.03em}

.loading{padding:48px 22px;text-align:center;color:var(--ink-soft);font-size:14px}

.growth-cta{
  margin-top:20px;padding:18px 16px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
}
.growth-cta .g-title{font-weight:600;font-size:14.5px;margin-bottom:6px;color:var(--ink)}
.growth-cta .g-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;max-width:320px;margin-left:auto;margin-right:auto}
.growth-cta .g-btn{
  display:inline-block;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;
  background:var(--brand);color:#fff;text-decoration:none;border:none;
}
.growth-cta .g-btn:hover{filter:brightness(1.08)}

@media (max-width: 560px) {
  .wrap{padding:16px 12px calc(48px + env(safe-area-inset-bottom,0));max-width:100%}
  body{font-size:15px;-webkit-text-size-adjust:100%}
  .row .v,.row div{word-break:break-word}
  .growth-cta{padding:14px 12px}
  .growth-cta .g-btn{display:block;width:100%;box-sizing:border-box;min-height:48px;padding:13px 16px;line-height:1.2}
}
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap" id="root">
  <div class="vdoc"><div class="loading">Retrieving record…</div></div>
</div>
<script>
"use strict";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function money(amount, code) {
  var n = Number(amount);
  if (!isFinite(n)) return "—";
  try {
    return (code || "UGX") + " " + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  } catch (e) {
    return (code || "UGX") + " " + n;
  }
}
function fmtDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
}
function fmtStamp(ts) {
  if (!ts) return "—";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts);
  return fmtDate(ts) + " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function maskRef(ref) {
  var s = String(ref || "").trim();
  if (!s) return "—";
  return s.length <= 4 ? "••" + s.slice(-2) : "••••" + s.slice(-4);
}
function qs(k) {
  return new URLSearchParams(location.search).get(k) || "";
}

function cfg() { return window.HANDZJ_CONFIG || {}; }

async function lookup(no, id) {
  var c = cfg();
  if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY || !window.supabase) {
    throw new Error("Verification service is not configured.");
  }
  var client = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
  var { data, error } = await client.rpc("verify_receipt", {
    p_receipt_no: no,
    p_verify_id: id || null
  });
  if (error) throw error;
  return data && data[0] ? data[0] : null;
}

function appOrigin() {
  var c = window.HANDZJ_CONFIG || {};
  if (c.APP_URL) return String(c.APP_URL).replace(/\/$/, "");
  return location.origin;
}

/* A customer left blank at issue time is stored as "Walk-in customer" by
   the app — treat that (and any blank/whitespace value) as "not provided"
   rather than printing the placeholder as if it were a real name. */
function isNamelessCustomer(name) {
  var s = String(name || "").trim().toLowerCase();
  return !s || s === "walk-in customer" || s === "walk in customer";
}

function itemsHtml(row) {
  if (row.lines && row.lines.length) {
    var rows = row.lines.map(function (L) {
      var qty = (L.qty === undefined || L.qty === null || L.qty === "") ? "1" : esc(L.qty);
      var lineTotal = (L.total !== undefined && L.total !== null && L.total !== "")
        ? money(L.total, row.currency)
        : "";
      return '<tr><td>' + esc(L.name || "—") + '</td><td class="num">' + qty + '</td><td class="num">' + esc(lineTotal) + '</td></tr>';
    }).join("");
    return '<table class="items-table"><thead><tr><th>Item / service</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  if (row.item) {
    return '<div class="row"><span class="k">Item / service</span><span class="v">' + esc(row.item) + '</span></div>';
  }
  return "";
}

function narrativeText(row) {
  var who = esc(row.business_name || "the issuing business");
  var where = row.branch_name ? ", " + esc(row.branch_name) : "";
  var toWhom = isNamelessCustomer(row.customer_name) ? "" : " to " + esc(row.customer_name);
  var when = row.paid_on || row.created_at ? " on " + esc(fmtDate(row.paid_on || row.created_at)) : "";
  var amt = esc(money(row.amount, row.currency));
  var pay = row.method ? " paid by " + esc(row.method) : "";
  return "This receipt was issued by " + who + where + toWhom + when +
    ". The receipt records a purchase of " + amt + pay + ".";
}

function render(no, id, row, err) {
  var root = document.getElementById("root");
  var status = "unk", mark = "?", label = "RECEIPT NOT FOUND", sub = "No matching record was found for this receipt number.";

  if (err) {
    status = "unk"; mark = "!"; label = "VERIFICATION UNAVAILABLE"; sub = "The verification service could not be reached. Try again in a moment.";
  } else if (row) {
    if (row.status === "VOIDED") {
      status = "bad"; mark = "✕"; label = "RECEIPT VOIDED"; sub = "This receipt was previously issued but has been voided by the issuer.";
    } else {
      status = "ok"; mark = "✓"; label = "VALID RECEIPT"; sub = "This receipt record was retrieved from the issuing platform.";
    }
  }

  var origin = appOrigin();
  var signup = origin + "/login.html?mode=signup";

  var businessBlock = "", narrativeBlock = "", issuedToBlock = "", receiptBlock = "", purchaseBlock = "", totalBlock = "", paymentBlock = "", verifBlock = "";

  /* Business + branch shown for both VALID and VOIDED receipts — a voided
     receipt still genuinely came from this business; only the status
     changes. Nothing about a receipt is shown for NOT FOUND / UNAVAILABLE,
     since there is no verified record to attribute it to. */
  if (row) {
    var logo = row.business_logo || "/logo.jpg";
    var branchLine = "";
    if (row.branch_name) {
      branchLine += esc(row.branch_name);
      if (row.branch_address) branchLine += " &middot; " + esc(row.branch_address);
    } else if (row.branch_address) {
      branchLine += esc(row.branch_address);
    }
    businessBlock =
      '<div class="biz">' +
        '<img src="' + esc(logo) + '" alt="">' +
        '<div><div class="name">' + esc(row.business_name || "—") + '</div>' +
        (branchLine ? '<div class="sub">' + branchLine + '</div>' : '') +
        (row.business_phone ? '<div class="sub">Phone: ' + esc(row.business_phone) + '</div>' : '') +
        '</div>' +
      '</div>';

    narrativeBlock = '<div class="narrative">' + narrativeText(row) + '</div>';

    var custDisplay = isNamelessCustomer(row.customer_name)
      ? '<div class="issued-to none">Customer name not provided</div>'
      : '<div class="issued-to">' + esc(row.customer_name) + '</div>';
    issuedToBlock =
      '<div class="section"><div class="sh">Issued to</div>' + custDisplay + '</div>';

    receiptBlock =
      '<div class="section"><div class="sh">Receipt</div>' +
        '<div class="row"><span class="k">Receipt no.</span><span class="v mono">' + esc(row.receipt_no || no || "—") + '</span></div>' +
        '<div class="row"><span class="k">Date &amp; time</span><span class="v mono">' + esc(fmtStamp(row.created_at) !== "—" ? fmtStamp(row.created_at) : fmtDate(row.paid_on)) + '</span></div>' +
      '</div>';

    var items = itemsHtml(row);
    if (items) {
      purchaseBlock = '<div class="section"><div class="sh">Purchase</div>' + items + '</div>';
    }

    totalBlock =
      '<div class="total-bar"><div class="l">Total</div><div class="v">' + esc(money(row.amount, row.currency)) + '</div></div>';

    paymentBlock =
      '<div class="section"><div class="sh">Payment</div>' +
        '<div class="row"><span class="k">Method</span><span class="v">' + esc(row.method || "—") + '</span></div>' +
        '<div class="row"><span class="k">Reference</span><span class="v mono">' + esc(row.txn_masked || maskRef(row.txn)) + '</span></div>' +
      '</div>';

    var verifLines = '<b>' + esc(label) + '.</b> ' + esc(sub);
    if (row.status === "VOIDED" && row.voided_at) {
      verifLines += '<br>Voided: ' + esc(fmtStamp(row.voided_at));
    }
    verifBlock = '<div class="verif-note">' + verifLines + '</div>';
  } else if (!err) {
    receiptBlock =
      '<div class="section"><div class="sh">Receipt</div>' +
        '<div class="row"><span class="k">Receipt no.</span><span class="v mono">' + esc(no || "—") + '</span></div>' +
        '<div class="row"><span class="k">Status</span><span class="v"><b>NOT FOUND</b></span></div>' +
      '</div>';
  }

  var cta =
    '<div class="growth-cta">' +
      '<div class="g-title">Digital receipts for your business?</div>' +
      '<div class="g-sub">Create professional receipts, share them with customers, and let customers verify them online.</div>' +
      '<a class="g-btn" href="' + esc(signup) + '">Start Free</a>' +
    '</div>';

  root.innerHTML =
    '<div class="vdoc">' +
      '<div class="vdoc-head">' +
        '<div class="title">Receipt Verification</div>' +
        '<div class="rno mono">' + esc(no || "—") + '</div>' +
      '</div>' +
      '<div class="vdoc-status">' +
        '<div class="status-mark ' + status + '">' + mark + '</div>' +
        '<div class="status-label ' + status + '">' + label + '</div>' +
        '<div class="status-sub">' + esc(sub) + '</div>' +
      '</div>' +
      businessBlock +
      narrativeBlock +
      issuedToBlock +
      receiptBlock +
      purchaseBlock +
      totalBlock +
      paymentBlock +
      verifBlock +
    '</div>' +
    cta +
    '<p class="foot">' +
      'Powered by <a href="' + esc(origin + "/") + '">HandzJ Digital Receipts</a><br>' +
      'This is not a government or tax authority certification.' +
    '</p>';
}

(async function () {
  var no = qs("no");
  var id = qs("id");
  if (!no) {
    render("", "", null, null);
    return;
  }
  var timedOut = false;
  var timer = setTimeout(function () {
    timedOut = true;
    render(no, id, null, new Error("timeout"));
  }, 12000);
  try {
    var row = await lookup(no, id);
    if (timedOut) return;
    clearTimeout(timer);
    render(no, id, row, null);
  } catch (e) {
    if (timedOut) return;
    clearTimeout(timer);
    render(no, id, null, e);
  }
})();
</script>
</body>
</html>
