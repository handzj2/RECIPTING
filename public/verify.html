<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Verification | HandzJ Digital Receipts</title>
<meta name="description" content="Verify a HandzJ digital receipt and confirm its receipt status and details.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5; --panel:#ffffff; --ink:#0f1724; --ink-soft:#4a5568;
  --line:#d0d7e2; --brand:#0a1628; --ok:#0f7b52; --ok-soft:#e2f4ec;
  --bad:#a32020; --bad-soft:#fbe7e7; --unk:#6b7789; --unk-soft:#eef1f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c111a; --panel:#141b26; --ink:#e8edf5; --ink-soft:#9dabc0;
    --line:#26303f; --ok:#5fd6a4; --ok-soft:#10301f;
    --bad:#ff8a8a; --bad-soft:#341414; --unk:#8c97a8; --unk-soft:#1c2533;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:32px 16px 64px}

/* Document-style verification identity */
.vdoc{background:var(--panel);border:1px solid var(--line);border-radius:0}
.vdoc-head{padding:20px 22px 16px;border-bottom:3px solid var(--brand);text-align:center}
.vdoc-head .title{font-family:"Barlow Condensed",Inter,sans-serif;font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.vdoc-head .rno{font-family:"Barlow Condensed",Inter,sans-serif;font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--brand)}
.vdoc-body{padding:28px 22px 24px;text-align:center}
.status-mark{width:56px;height:56px;margin:0 auto 14px;border:3px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;line-height:1}
.status-mark.ok{border-color:var(--ok);color:var(--ok)}
.status-mark.bad{border-color:var(--bad);color:var(--bad)}
.status-mark.unk{border-color:var(--unk);color:var(--unk)}
.status-label{font-family:"Barlow Condensed",Inter,sans-serif;font-size:28px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.status-label.ok{color:var(--ok)}
.status-label.bad{color:var(--bad)}
.status-label.unk{color:var(--unk)}
.status-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px}

.block{text-align:left;border-top:1px solid var(--line);padding:16px 0 0;margin-top:4px}
.block .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px solid #e8edf4}
.block .row:last-child{border-bottom:0}
.block .k{color:var(--ink-soft);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;flex:0 0 120px}
.block .v{text-align:right;font-weight:500}
.block .v b{font-weight:700}

.issuer-bar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel)}
.issuer-bar img{width:40px;height:40px;border-radius:2px;object-fit:cover;background:var(--line);border:1px solid var(--line)}
.issuer-bar .t1{font-family:"Barlow Condensed",Inter,sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em}
.issuer-bar .t2{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em}

.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--ink-soft);line-height:1.65}
.foot a{color:inherit;text-decoration:underline}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.03em}

.loading{padding:48px 22px;text-align:center;color:var(--ink-soft);font-size:14px}

/* Subtle growth CTA — secondary to the receipt, not an ad inside the document */
.growth-cta{
  margin-top:20px;padding:18px 16px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
}
.growth-cta .g-title{font-weight:600;font-size:14.5px;margin-bottom:6px;color:var(--ink)}
.growth-cta .g-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;max-width:320px;margin-left:auto;margin-right:auto}
.growth-cta .g-btn{
  display:inline-block;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;
  background:var(--brand);color:#fff;text-decoration:none;border:none;
}
.growth-cta .g-btn:hover{filter:brightness(1.08)}
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap" id="root">
  <div class="vdoc"><div class="loading">Retrieving record…</div></div>
</div>
<script>
"use strict";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function money(amount, code) {
  var n = Number(amount);
  if (!isFinite(n)) return "—";
  try {
    return (code || "UGX") + " " + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  } catch (e) {
    return (code || "UGX") + " " + n;
  }
}
function fmtDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
}
function fmtStamp(ts) {
  if (!ts) return "—";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts);
  return fmtDate(ts) + " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function maskRef(ref) {
  var s = String(ref || "").trim();
  if (!s) return "—";
  return s.length <= 4 ? "••" + s.slice(-2) : "••••" + s.slice(-4);
}
function qs(k) {
  return new URLSearchParams(location.search).get(k) || "";
}

function cfg() { return window.HANDZJ_CONFIG || {}; }

async function lookup(no, id) {
  var c = cfg();
  if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY || !window.supabase) {
    throw new Error("Verification service is not configured.");
  }
  var client = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
  var { data, error } = await client.rpc("verify_receipt", {
    p_receipt_no: no,
    p_verify_id: id || null
  });
  if (error) throw error;
  return data && data[0] ? data[0] : null;
}

function appOrigin() {
  var c = window.HANDZJ_CONFIG || {};
  if (c.APP_URL) return String(c.APP_URL).replace(/\/$/, "");
  return location.origin;
}

function render(no, id, row, err) {
  var root = document.getElementById("root");
  /* Clear, distinct states — never leave the user on "Retrieving…" */
  var status = "unk", mark = "?", label = "RECEIPT NOT FOUND", sub = "No matching record was found for this receipt number.";

  if (err) {
    status = "unk"; mark = "!"; label = "VERIFICATION UNAVAILABLE"; sub = "The verification service could not be reached. Try again in a moment.";
  } else if (row) {
    if (row.status === "VOIDED") {
      status = "bad"; mark = "✕"; label = "RECEIPT VOIDED"; sub = "This receipt was voided by the issuer and is no longer valid.";
    } else {
      status = "ok"; mark = "✓"; label = "VALID RECEIPT"; sub = "This record was retrieved from the issuing platform.";
    }
  }

  var logo = (row && row.business_logo) || "/logo.jpg";
  var who = (row && row.business_name) || "HandzJ Digital Receipts";
  var origin = appOrigin();
  var signup = origin + "/login.html?mode=signup";

  var body = "";
  if (row) {
    body =
      '<div class="block">' +
        '<div class="row"><span class="k">Issued by</span><span class="v">' + esc(who) + '</span></div>' +
        '<div class="row"><span class="k">Date issued</span><span class="v mono">' + esc(fmtDate(row.paid_on || row.created_at)) + '</span></div>' +
        '<div class="row"><span class="k">Amount</span><span class="v"><b>' + esc(money(row.amount, row.currency)) + '</b></span></div>' +
        '<div class="row"><span class="k">Payment</span><span class="v">' + esc(row.method || "—") + '</span></div>' +
        (row.item ? '<div class="row"><span class="k">Item</span><span class="v">' + esc(row.item) + '</span></div>' : '') +
        '<div class="row"><span class="k">Reference</span><span class="v mono">' + esc(row.txn_masked || maskRef(row.txn)) + '</span></div>' +
      '</div>';
    if (row.status === "VOIDED" && row.voided_at) {
      body += '<p style="margin:14px 0 0;font-size:12.5px;color:var(--bad)">Voided: ' + esc(fmtStamp(row.voided_at)) + '</p>';
    }
  } else if (!err) {
    body =
      '<div class="block">' +
        '<div class="row"><span class="k">Receipt</span><span class="v mono">' + esc(no || "—") + '</span></div>' +
        '<div class="row"><span class="k">Status</span><span class="v"><b>NOT FOUND</b></span></div>' +
      '</div>';
  }

  /* Growth CTA — secondary to the receipt, does not claim HandzJ made the sale */
  var cta =
    '<div class="growth-cta">' +
      '<div class="g-title">Digital receipts for your business?</div>' +
      '<div class="g-sub">Create professional receipts, share them with customers, and let customers verify them online.</div>' +
      '<a class="g-btn" href="' + esc(signup) + '">Start Free</a>' +
    '</div>';

  root.innerHTML =
    '<div class="vdoc">' +
      '<div class="vdoc-head">' +
        '<div class="title">Receipt Verification</div>' +
        '<div class="rno mono">' + esc(no || "—") + '</div>' +
      '</div>' +
      '<div class="vdoc-body">' +
        '<div class="status-mark ' + status + '">' + mark + '</div>' +
        '<div class="status-label ' + status + '">' + label + '</div>' +
        '<div class="status-sub">' + esc(sub) + '</div>' +
        body +
      '</div>' +
      '<div class="issuer-bar">' +
        '<img src="' + esc(logo) + '" alt="">' +
        '<div><div class="t1">' + esc(who) + '</div><div class="t2">Issuing merchant record</div></div>' +
      '</div>' +
    '</div>' +
    cta +
    '<p class="foot">' +
      'Powered by <a href="' + esc(origin + "/") + '">HandzJ Digital Receipts</a><br>' +
      'Receipt identity: <span class="mono">' + esc(no || "—") + '</span><br>' +
      'This is not a government or tax authority certification.' +
    '</p>';
}

(async function () {
  var no = qs("no");
  var id = qs("id");
  if (!no) {
    render("", "", null, null);
    return;
  }
  /* Hard timeout so the UI never stays on "Retrieving record…" indefinitely */
  var timedOut = false;
  var timer = setTimeout(function () {
    timedOut = true;
    render(no, id, null, new Error("timeout"));
  }, 12000);
  try {
    var row = await lookup(no, id);
    if (timedOut) return;
    clearTimeout(timer);
    render(no, id, row, null);
  } catch (e) {
    if (timedOut) return;
    clearTimeout(timer);
    render(no, id, null, e);
  }
})();
</script>
</body>
</html>
